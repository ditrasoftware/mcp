version: "3.8"

# Purpose: MCP-focused local/dev compose for the template server.
# This is the canonical compose file in this server folder.

services:
  ditrasoftware-mcp:
    build: .
    container_name: ditrasoftware-mcp
    environment:
      # Configure base API settings
      DITRASOFTWARE_API_BASE_URL: ${DITRASOFTWARE_API_BASE_URL:-}
      DITRASOFTWARE_API_TIMEOUT_SECONDS: ${DITRASOFTWARE_API_TIMEOUT_SECONDS:-30}
      DITRASOFTWARE_VERIFY_SSL: ${DITRASOFTWARE_VERIFY_SSL:-true}
      DITRASOFTWARE_DEFAULT_API_KEY: ${DITRASOFTWARE_DEFAULT_API_KEY:-}

      # Configure gateway behavior
      DITRASOFTWARE_GATEWAY_MODE: ${DITRASOFTWARE_GATEWAY_MODE:-hybrid}
      DITRASOFTWARE_GATEWAY_ROUTE_POLICY: ${DITRASOFTWARE_GATEWAY_ROUTE_POLICY:-local_preferred}
      DITRASOFTWARE_GATEWAY_MOUNT_ON_STARTUP: ${DITRASOFTWARE_GATEWAY_MOUNT_ON_STARTUP:-true}
      DITRASOFTWARE_GATEWAY_ALLOW_DIRECT_CALLS: ${DITRASOFTWARE_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      DITRASOFTWARE_GATEWAY_DIRECT_RESULT_STRATEGY: ${DITRASOFTWARE_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}

      # Remote MCP backend configuration
      DITRASOFTWARE_GATEWAY_REMOTES_JSON: ${DITRASOFTWARE_GATEWAY_REMOTES_JSON:-}
      DITRASOFTWARE_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${DITRASOFTWARE_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}

      # FastMCP settings
      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8001}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}
      FASTMCP_STATELESS_HTTP: ${FASTMCP_STATELESS_HTTP:-true}

      # Optional MCP auth mode
      DITRASOFTWARE_MCP_AUTH_MODE: ${DITRASOFTWARE_MCP_AUTH_MODE:-none}
      DITRASOFTWARE_MCP_BASE_URL: ${DITRASOFTWARE_MCP_BASE_URL:-}
      DITRASOFTWARE_MCP_RESOURCE_BASE_URL: ${DITRASOFTWARE_MCP_RESOURCE_BASE_URL:-}
      DITRASOFTWARE_MCP_AUTH_DEBUG: ${DITRASOFTWARE_MCP_AUTH_DEBUG:-false}
      DITRASOFTWARE_OIDC_CONFIG_URL: ${DITRASOFTWARE_OIDC_CONFIG_URL:-}
      DITRASOFTWARE_OIDC_CLIENT_ID: ${DITRASOFTWARE_OIDC_CLIENT_ID:-}
      DITRASOFTWARE_OIDC_CLIENT_SECRET: ${DITRASOFTWARE_OIDC_CLIENT_SECRET:-}
      DITRASOFTWARE_OIDC_JWT_SIGNING_KEY: ${DITRASOFTWARE_OIDC_JWT_SIGNING_KEY:-}
      DITRASOFTWARE_OIDC_REQUIRED_SCOPES: ${DITRASOFTWARE_OIDC_REQUIRED_SCOPES:-openid profile email}
      DITRASOFTWARE_OIDC_ALLOWED_CLIENT_REDIRECT_URIS: ${DITRASOFTWARE_OIDC_ALLOWED_CLIENT_REDIRECT_URIS:-}
      DITRASOFTWARE_OIDC_VERIFY_ID_TOKEN: ${DITRASOFTWARE_OIDC_VERIFY_ID_TOKEN:-false}
      DITRASOFTWARE_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${DITRASOFTWARE_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}

    ports:
      - "${FASTMCP_PORT:-8001}:8001"
    restart: unless-stopped
