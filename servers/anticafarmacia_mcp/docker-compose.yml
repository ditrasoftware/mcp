# Purpose: deployment-oriented compose for AnticaFarmacia MCP with OAuth 2.1 + GCIP support.
# Use this file when running prebuilt images and shared external networking.
# For local development/MCP-focused testing, use docker-compose-mcp.yml instead.
services:
  anticafarmacia_mcp:
    # Deployment image built by build.sh (TAG=1.0.0)
    image: ${ANTICAFARMACIA_MCP_IMAGE:-gcr.io/oxytrack-322814/ditra-anticafarmacia-mcp:1.0.0}
    pull_policy: always
    container_name: anticafarmacia-mcp
    environment:
      # ============================================================================
      # Base API settings
      # ============================================================================
      ANTICAFARMACIA_API_BASE_URL: ${ANTICAFARMACIA_API_BASE_URL:-}
      ANTICAFARMACIA_API_TIMEOUT_SECONDS: ${ANTICAFARMACIA_API_TIMEOUT_SECONDS:-30}
      ANTICAFARMACIA_VERIFY_SSL: ${ANTICAFARMACIA_VERIFY_SSL:-true}
      ANTICAFARMACIA_DEFAULT_API_KEY: ${ANTICAFARMACIA_DEFAULT_API_KEY:-}
      ANTICAFARMACIA_CACHE_TTL: ${ANTICAFARMACIA_CACHE_TTL:-}
      ANTICAFARMACIA_CACHE_SCOPE: ${ANTICAFARMACIA_CACHE_SCOPE:-}
      ANTICAFARMACIA_LIST_PAGE_SIZE: ${ANTICAFARMACIA_LIST_PAGE_SIZE:-}
      ANTICAFARMACIA_MASK_ERROR_DETAILS: ${ANTICAFARMACIA_MASK_ERROR_DETAILS:-false}

      # ============================================================================
      # Gateway settings (hybrid mode with local_preferred routing)
      # ============================================================================
      ANTICAFARMACIA_GATEWAY_MODE: ${ANTICAFARMACIA_GATEWAY_MODE:-hybrid}
      ANTICAFARMACIA_GATEWAY_ROUTE_POLICY: ${ANTICAFARMACIA_GATEWAY_ROUTE_POLICY:-local_preferred}
      ANTICAFARMACIA_GATEWAY_MOUNT_ON_STARTUP: ${ANTICAFARMACIA_GATEWAY_MOUNT_ON_STARTUP:-true}
      ANTICAFARMACIA_GATEWAY_ALLOW_DIRECT_CALLS: ${ANTICAFARMACIA_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      ANTICAFARMACIA_GATEWAY_DIRECT_RESULT_STRATEGY: ${ANTICAFARMACIA_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}
      ANTICAFARMACIA_GATEWAY_ENABLE_TOOLBOX: ${ANTICAFARMACIA_GATEWAY_ENABLE_TOOLBOX:-false}
      ANTICAFARMACIA_GATEWAY_ENABLE_DPOP_FOR_REMOTES: ${ANTICAFARMACIA_GATEWAY_ENABLE_DPOP_FOR_REMOTES:-false}
      
      # Remote MCP endpoints (Google Workspace)
      GOOGLE_WORKSPACE_MCP_URL: ${GOOGLE_WORKSPACE_MCP_URL:-https://workspace.dchat.ditra.app/mcp}
      GOOGLE_WORKSPACE_MCP_BEARER_TOKEN: ${GOOGLE_WORKSPACE_MCP_BEARER_TOKEN:-}
      GOOGLE_WORKSPACE_MCP_OAUTH_TOKEN_ENDPOINT: ${GOOGLE_WORKSPACE_MCP_OAUTH_TOKEN_ENDPOINT:-https://workspace.dchat.ditra.app/token}
      GOOGLE_WORKSPACE_MCP_OAUTH_CLIENT_ID: ${GOOGLE_WORKSPACE_MCP_OAUTH_CLIENT_ID:-}
      GOOGLE_WORKSPACE_MCP_OAUTH_CLIENT_SECRET: ${GOOGLE_WORKSPACE_MCP_OAUTH_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_MCP_OAUTH_REFRESH_TOKEN: ${GOOGLE_WORKSPACE_MCP_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_WORKSPACE_MCP_OAUTH_SCOPE: ${GOOGLE_WORKSPACE_MCP_OAUTH_SCOPE:-}
      GOOGLE_WORKSPACE_MCP_OAUTH_TOKEN_ENDPOINT_AUTH_METHOD: ${GOOGLE_WORKSPACE_MCP_OAUTH_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_basic}
      GOOGLE_TOOLBOX_MCP_URL: ${GOOGLE_TOOLBOX_MCP_URL:-http://google-toolbox-mcp:8000/mcp}
      GOOGLE_TOOLBOX_MCP_BEARER_TOKEN: ${GOOGLE_TOOLBOX_MCP_BEARER_TOKEN:-}
      ANTICAFARMACIA_GATEWAY_ENABLE_GOOGLE_TOOLBOX_MCP: ${ANTICAFARMACIA_GATEWAY_ENABLE_GOOGLE_TOOLBOX_MCP:-false}
      ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_MCP_URL: ${ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_MCP_URL:-${GOOGLE_TOOLBOX_MCP_URL:-http://google-toolbox-mcp:8000/mcp}}
      ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_MCP_AUTH: ${ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_MCP_AUTH:-${GOOGLE_TOOLBOX_MCP_BEARER_TOKEN:-}}
      ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_INIT_TIMEOUT_MS: ${ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_INIT_TIMEOUT_MS:-20000}
      ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_TIMEOUT_MS: ${ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_TIMEOUT_MS:-60000}
      ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_SERVER_INSTRUCTIONS: ${ANTICAFARMACIA_GATEWAY_GOOGLE_TOOLBOX_SERVER_INSTRUCTIONS:-true}
      ANTICAFARMACIA_GATEWAY_REMOTES_JSON: '${ANTICAFARMACIA_GATEWAY_REMOTES_JSON:-[{"name":"google-workspace-mcp","namespace":"google_workspace_mcp","type":"streamable-http","url":"${GOOGLE_WORKSPACE_MCP_URL:-https://workspace.dchat.ditra.app/mcp}","auth":"${GOOGLE_WORKSPACE_MCP_BEARER_TOKEN:-__auto__}","initTimeout":20000,"timeout":60000,"serverInstructions":true,"enabled":true},{"name":"google-toolbox-mcp","namespace":"google_toolbox_mcp","type":"streamable-http","url":"${GOOGLE_TOOLBOX_MCP_URL:-http://google-toolbox-mcp:8000/mcp}","auth":"${GOOGLE_TOOLBOX_MCP_BEARER_TOKEN:-}","initTimeout":20000,"timeout":60000,"serverInstructions":true,"enabled":false}]}'
      ANTICAFARMACIA_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${ANTICAFARMACIA_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}

      # ============================================================================
      # FastMCP HTTP settings (stateless, multi-tenant aware)
      # ============================================================================
      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8002}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}
      FASTMCP_STATELESS_HTTP: ${FASTMCP_STATELESS_HTTP:-true}
      FASTMCP_WIDGET_DOMAIN_MODE: ${FASTMCP_WIDGET_DOMAIN_MODE:-claude}
      ANTICAFARMACIA_MCP_HOST_PORT: ${ANTICAFARMACIA_MCP_HOST_PORT:-8094}

      # ============================================================================
      # Inbound MCP Auth (OIDC Proxy + GCIP)
      # ============================================================================
      ANTICAFARMACIA_MCP_AUTH_MODE: ${ANTICAFARMACIA_MCP_AUTH_MODE:-none}
      ANTICAFARMACIA_MCP_BASE_URL: ${ANTICAFARMACIA_MCP_BASE_URL:-}
      ANTICAFARMACIA_MCP_RESOURCE_BASE_URL: ${ANTICAFARMACIA_MCP_RESOURCE_BASE_URL:-}
      ANTICAFARMACIA_MCP_RESOURCE_DOCUMENTATION: ${ANTICAFARMACIA_MCP_RESOURCE_DOCUMENTATION:-}
      ANTICAFARMACIA_MCP_RESOURCE_NAME: ${ANTICAFARMACIA_MCP_RESOURCE_NAME:-Antica Farmacia MCP}
      ANTICAFARMACIA_MCP_AUTH_DEBUG: ${ANTICAFARMACIA_MCP_AUTH_DEBUG:-false}
      
      # OIDC Config (Google Cloud Identity Platform)
      ANTICAFARMACIA_OIDC_CONFIG_URL: ${ANTICAFARMACIA_OIDC_CONFIG_URL:-}
      ANTICAFARMACIA_OIDC_CLIENT_ID: ${ANTICAFARMACIA_OIDC_CLIENT_ID:-}
      ANTICAFARMACIA_OIDC_CLIENT_SECRET: ${ANTICAFARMACIA_OIDC_CLIENT_SECRET:-}
      ANTICAFARMACIA_OIDC_JWT_SIGNING_KEY: ${ANTICAFARMACIA_OIDC_JWT_SIGNING_KEY:-}
      ANTICAFARMACIA_OIDC_REQUIRED_SCOPES: ${ANTICAFARMACIA_OIDC_REQUIRED_SCOPES:-openid profile email}
      ANTICAFARMACIA_OIDC_ALLOWED_CLIENT_REDIRECT_URIS: ${ANTICAFARMACIA_OIDC_ALLOWED_CLIENT_REDIRECT_URIS:-}
      ANTICAFARMACIA_OIDC_VERIFY_ID_TOKEN: ${ANTICAFARMACIA_OIDC_VERIFY_ID_TOKEN:-false}
      ANTICAFARMACIA_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${ANTICAFARMACIA_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}

      # ============================================================================
      # OAuth 2.1 Security (PKCE, DPoP, Token Binding)
      # ============================================================================
      ANTICAFARMACIA_PKCE_ENABLED: ${ANTICAFARMACIA_PKCE_ENABLED:-false}
      ANTICAFARMACIA_PKCE_METHOD: ${ANTICAFARMACIA_PKCE_METHOD:-S256}
      ANTICAFARMACIA_PKCE_VERIFIER_LENGTH: ${ANTICAFARMACIA_PKCE_VERIFIER_LENGTH:-128}
      ANTICAFARMACIA_PKCE_CHALLENGE_METHOD_ENFORCED: ${ANTICAFARMACIA_PKCE_CHALLENGE_METHOD_ENFORCED:-true}

      ANTICAFARMACIA_DPOP_ENABLED: ${ANTICAFARMACIA_DPOP_ENABLED:-false}
      ANTICAFARMACIA_DPOP_KEY_BINDING_METHOD: ${ANTICAFARMACIA_DPOP_KEY_BINDING_METHOD:-jwt_based}
      ANTICAFARMACIA_DPOP_REQUIRE_FOR_REFRESH: ${ANTICAFARMACIA_DPOP_REQUIRE_FOR_REFRESH:-false}
      ANTICAFARMACIA_DPOP_PROOF_NONCE_TTL_SECONDS: ${ANTICAFARMACIA_DPOP_PROOF_NONCE_TTL_SECONDS:-60}
      ANTICAFARMACIA_DPOP_TOKEN_BINDING_BACKEND: ${ANTICAFARMACIA_DPOP_TOKEN_BINDING_BACKEND:-memory}
      ANTICAFARMACIA_DPOP_REDIS_URL: ${ANTICAFARMACIA_DPOP_REDIS_URL:-}

      ANTICAFARMACIA_TOKEN_BINDING_ENABLED: ${ANTICAFARMACIA_TOKEN_BINDING_ENABLED:-false}
      ANTICAFARMACIA_TOKEN_BINDING_METHOD: ${ANTICAFARMACIA_TOKEN_BINDING_METHOD:-dpop}

      # ============================================================================
      # GCIP (Google Cloud Identity Platform) Integration
      # ============================================================================
      ANTICAFARMACIA_GCIP_ENABLED: ${ANTICAFARMACIA_GCIP_ENABLED:-false}
      ANTICAFARMACIA_GCIP_PROJECT_ID: ${ANTICAFARMACIA_GCIP_PROJECT_ID:-}
      ANTICAFARMACIA_GCIP_CONFIG_URL: ${ANTICAFARMACIA_GCIP_CONFIG_URL:-}
      ANTICAFARMACIA_GCIP_CLIENT_ID: ${ANTICAFARMACIA_GCIP_CLIENT_ID:-}
      ANTICAFARMACIA_GCIP_CLIENT_SECRET: ${ANTICAFARMACIA_GCIP_CLIENT_SECRET:-}
      ANTICAFARMACIA_GCIP_FEDERATED_PROVIDERS: ${ANTICAFARMACIA_GCIP_FEDERATED_PROVIDERS:-}
      ANTICAFARMACIA_GCIP_DOWNSTREAM_SCOPES_PREFIX: ${ANTICAFARMACIA_GCIP_DOWNSTREAM_SCOPES_PREFIX:-}
      ANTICAFARMACIA_GCIP_NAMESPACE_ISOLATION_ENABLED: ${ANTICAFARMACIA_GCIP_NAMESPACE_ISOLATION_ENABLED:-false}
      ANTICAFARMACIA_GCIP_CLAIM_TRANSFORMS_ENABLED: ${ANTICAFARMACIA_GCIP_CLAIM_TRANSFORMS_ENABLED:-false}

      # ============================================================================
      # Multi-Tenant Configuration (Tenant Isolation & Forwarding)
      # ============================================================================
      ANTICAFARMACIA_TENANT_ENABLED: ${ANTICAFARMACIA_TENANT_ENABLED:-false}
      ANTICAFARMACIA_TENANT_ISOLATION_ENABLED: ${ANTICAFARMACIA_TENANT_ISOLATION_ENABLED:-false}
      ANTICAFARMACIA_TENANT_EXTRACT_CLAIM: ${ANTICAFARMACIA_TENANT_EXTRACT_CLAIM:-organizations}
      ANTICAFARMACIA_TENANT_FALLBACK_CLAIMS: ${ANTICAFARMACIA_TENANT_FALLBACK_CLAIMS:-}
      ANTICAFARMACIA_TENANT_FORWARD_TO_DOWNSTREAM: ${ANTICAFARMACIA_TENANT_FORWARD_TO_DOWNSTREAM:-false}
      ANTICAFARMACIA_TENANT_HEADER_NAME: ${ANTICAFARMACIA_TENANT_HEADER_NAME:-X-Tenant-ID}
      ANTICAFARMACIA_TENANT_ENFORCE_TENANT_SCOPE_ISOLATION: ${ANTICAFARMACIA_TENANT_ENFORCE_TENANT_SCOPE_ISOLATION:-false}
      ANTICAFARMACIA_TENANT_SCOPE_FORMAT: ${ANTICAFARMACIA_TENANT_SCOPE_FORMAT:-{tenant}:{scope}}

      # ============================================================================
      # Advanced Token Management
      # ============================================================================
      ANTICAFARMACIA_TOKEN_ENABLED: ${ANTICAFARMACIA_TOKEN_ENABLED:-true}
      ANTICAFARMACIA_TOKEN_ACCESS_TOKEN_TTL_SECONDS: ${ANTICAFARMACIA_TOKEN_ACCESS_TOKEN_TTL_SECONDS:-3600}
      ANTICAFARMACIA_TOKEN_REFRESH_TOKEN_TTL_SECONDS: ${ANTICAFARMACIA_TOKEN_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      ANTICAFARMACIA_TOKEN_AUTO_REFRESH_BUFFER_SECONDS: ${ANTICAFARMACIA_TOKEN_AUTO_REFRESH_BUFFER_SECONDS:-300}
      ANTICAFARMACIA_TOKEN_REFRESH_ENABLED: ${ANTICAFARMACIA_TOKEN_REFRESH_ENABLED:-true}
      ANTICAFARMACIA_TOKEN_ROTATION_ENABLED: ${ANTICAFARMACIA_TOKEN_ROTATION_ENABLED:-false}
      ANTICAFARMACIA_TOKEN_ROTATION_POLICY: ${ANTICAFARMACIA_TOKEN_ROTATION_POLICY:-always}
      ANTICAFARMACIA_TOKEN_ROTATION_MAX_AGE_SECONDS: ${ANTICAFARMACIA_TOKEN_ROTATION_MAX_AGE_SECONDS:-2592000}
      ANTICAFARMACIA_TOKEN_REVOCATION_ENABLED: ${ANTICAFARMACIA_TOKEN_REVOCATION_ENABLED:-false}
      ANTICAFARMACIA_TOKEN_REVOCATION_BACKEND: ${ANTICAFARMACIA_TOKEN_REVOCATION_BACKEND:-memory}
      ANTICAFARMACIA_TOKEN_REVOCATION_CHECK_INTERVAL_SECONDS: ${ANTICAFARMACIA_TOKEN_REVOCATION_CHECK_INTERVAL_SECONDS:-60}

      # ============================================================================
      # RBAC & Audit
      # ============================================================================
      ANTICAFARMACIA_RBAC_ENABLED: ${ANTICAFARMACIA_RBAC_ENABLED:-false}
      ANTICAFARMACIA_RBAC_ENFORCE_SCOPES: ${ANTICAFARMACIA_RBAC_ENFORCE_SCOPES:-false}
      ANTICAFARMACIA_RBAC_SCOPE_PREFIX: ${ANTICAFARMACIA_RBAC_SCOPE_PREFIX:-anticafarmacia:}
      ANTICAFARMACIA_RBAC_ROLES_ENABLED: ${ANTICAFARMACIA_RBAC_ROLES_ENABLED:-false}
      ANTICAFARMACIA_RBAC_RESOURCE_PERMISSIONS_ENABLED: ${ANTICAFARMACIA_RBAC_RESOURCE_PERMISSIONS_ENABLED:-false}
      ANTICAFARMACIA_AUDIT_ENABLED: ${ANTICAFARMACIA_AUDIT_ENABLED:-false}
      ANTICAFARMACIA_AUDIT_DESTINATION: ${ANTICAFARMACIA_AUDIT_DESTINATION:-stdout}
      ANTICAFARMACIA_AUDIT_LOG_AUTH_EVENTS: ${ANTICAFARMACIA_AUDIT_LOG_AUTH_EVENTS:-true}
      ANTICAFARMACIA_AUDIT_LOG_TOOL_ACCESS: ${ANTICAFARMACIA_AUDIT_LOG_TOOL_ACCESS:-false}
      ANTICAFARMACIA_AUDIT_LOG_API_CALLS: ${ANTICAFARMACIA_AUDIT_LOG_API_CALLS:-false}
      ANTICAFARMACIA_AUDIT_MASK_SENSITIVE_DATA: ${ANTICAFARMACIA_AUDIT_MASK_SENSITIVE_DATA:-true}
      ANTICAFARMACIA_AUDIT_RETENTION_DAYS: ${ANTICAFARMACIA_AUDIT_RETENTION_DAYS:-2555}

      # ============================================================================
      # Risk, MFA, Compliance, and optional integrations
      # ============================================================================
      ANTICAFARMACIA_RATE_LIMIT_ENABLED: ${ANTICAFARMACIA_RATE_LIMIT_ENABLED:-false}
      ANTICAFARMACIA_RATE_LIMIT_PER_USER_LIMIT: ${ANTICAFARMACIA_RATE_LIMIT_PER_USER_LIMIT:-120}
      ANTICAFARMACIA_RATE_LIMIT_PER_API_KEY_LIMIT: ${ANTICAFARMACIA_RATE_LIMIT_PER_API_KEY_LIMIT:-300}
      ANTICAFARMACIA_RATE_LIMIT_PER_IP_LIMIT: ${ANTICAFARMACIA_RATE_LIMIT_PER_IP_LIMIT:-240}
      ANTICAFARMACIA_RATE_LIMIT_PER_TENANT_LIMIT: ${ANTICAFARMACIA_RATE_LIMIT_PER_TENANT_LIMIT:-1200}
      ANTICAFARMACIA_RATE_LIMIT_STORAGE_BACKEND: ${ANTICAFARMACIA_RATE_LIMIT_STORAGE_BACKEND:-memory}

      ANTICAFARMACIA_MFA_ENABLED: ${ANTICAFARMACIA_MFA_ENABLED:-false}
      ANTICAFARMACIA_MFA_ENFORCE_MFA: ${ANTICAFARMACIA_MFA_ENFORCE_MFA:-false}
      ANTICAFARMACIA_MFA_SUPPORTED_METHODS: ${ANTICAFARMACIA_MFA_SUPPORTED_METHODS:-totp,sms,email}
      ANTICAFARMACIA_MFA_BACKUP_CODES_ENABLED: ${ANTICAFARMACIA_MFA_BACKUP_CODES_ENABLED:-true}
      ANTICAFARMACIA_MFA_TOTP_ISSUER: ${ANTICAFARMACIA_MFA_TOTP_ISSUER:-AnticaFarmacia-MCP}
      ANTICAFARMACIA_MFA_GRACE_PERIOD_DAYS: ${ANTICAFARMACIA_MFA_GRACE_PERIOD_DAYS:-14}

      ANTICAFARMACIA_RISK_MANAGEMENT_ENABLED: ${ANTICAFARMACIA_RISK_MANAGEMENT_ENABLED:-false}
      ANTICAFARMACIA_RISK_MANAGEMENT_IP_REPUTATION_CHECK: ${ANTICAFARMACIA_RISK_MANAGEMENT_IP_REPUTATION_CHECK:-false}
      ANTICAFARMACIA_RISK_MANAGEMENT_GEOLOCATION_CHECK: ${ANTICAFARMACIA_RISK_MANAGEMENT_GEOLOCATION_CHECK:-false}
      ANTICAFARMACIA_RISK_MANAGEMENT_DEVICE_FINGERPRINTING: ${ANTICAFARMACIA_RISK_MANAGEMENT_DEVICE_FINGERPRINTING:-false}
      ANTICAFARMACIA_RISK_MANAGEMENT_ANOMALY_DETECTION: ${ANTICAFARMACIA_RISK_MANAGEMENT_ANOMALY_DETECTION:-false}
      ANTICAFARMACIA_RISK_MANAGEMENT_MAX_CONCURRENT_SESSIONS: ${ANTICAFARMACIA_RISK_MANAGEMENT_MAX_CONCURRENT_SESSIONS:-10}
      ANTICAFARMACIA_RISK_MANAGEMENT_SESSION_TIMEOUT_MINUTES: ${ANTICAFARMACIA_RISK_MANAGEMENT_SESSION_TIMEOUT_MINUTES:-60}
      ANTICAFARMACIA_RISK_MANAGEMENT_STEP_UP_AUTH_ON_RISK: ${ANTICAFARMACIA_RISK_MANAGEMENT_STEP_UP_AUTH_ON_RISK:-false}

      # ============================================================================
      # Compliance & Optional Backends
      # ============================================================================
      ANTICAFARMACIA_COMPLIANCE_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_GDPR_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_GDPR_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_HIPAA_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_HIPAA_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_PCI_DSS_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_PCI_DSS_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_SOC2_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_SOC2_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_RIGHT_TO_BE_FORGOTTEN_ENABLED: ${ANTICAFARMACIA_COMPLIANCE_RIGHT_TO_BE_FORGOTTEN_ENABLED:-false}
      ANTICAFARMACIA_COMPLIANCE_AUDIT_RETENTION_YEARS: ${ANTICAFARMACIA_COMPLIANCE_AUDIT_RETENTION_YEARS:-7}
      ANTICAFARMACIA_REDIS_URL: ${ANTICAFARMACIA_REDIS_URL:-}
      ANTICAFARMACIA_REDIS_SSL: ${ANTICAFARMACIA_REDIS_SSL:-false}
      ANTICAFARMACIA_VAULT_ENABLED: ${ANTICAFARMACIA_VAULT_ENABLED:-false}

    ports:
      - "${ANTICAFARMACIA_MCP_HOST_PORT:-8094}:${FASTMCP_PORT:-8002}"

    networks:
      - default
      - ditra-shared

    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ditra-shared:
    external: true
    name: ditra-shared
