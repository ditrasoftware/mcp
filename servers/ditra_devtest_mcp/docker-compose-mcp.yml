# Purpose: MCP-focused local/dev compose for devtest federator scenarios.
# This file is intended to validate gateway routing, remote mounting,
# auth handling, and mixed local/remote tool execution.

services:
  ditra-devtest-mcp:
    build:
      context: ../..
      dockerfile: servers/ditra_devtest_mcp/Dockerfile
    container_name: ditra-devtest-mcp
    environment:
      # Configure base API settings
      DITRA_DEVTEST_API_BASE_URL: ${DITRA_DEVTEST_API_BASE_URL:-}
      DITRA_DEVTEST_API_TIMEOUT_SECONDS: ${DITRA_DEVTEST_API_TIMEOUT_SECONDS:-30}
      DITRA_DEVTEST_VERIFY_SSL: ${DITRA_DEVTEST_VERIFY_SSL:-true}
      DITRA_DEVTEST_DEFAULT_API_KEY: ${DITRA_DEVTEST_DEFAULT_API_KEY:-}

      # Configure gateway behavior
      DITRA_DEVTEST_GATEWAY_MODE: ${DITRA_DEVTEST_GATEWAY_MODE:-hybrid}
      DITRA_DEVTEST_GATEWAY_ROUTE_POLICY: ${DITRA_DEVTEST_GATEWAY_ROUTE_POLICY:-local_preferred}
      DITRA_DEVTEST_GATEWAY_MOUNT_ON_STARTUP: ${DITRA_DEVTEST_GATEWAY_MOUNT_ON_STARTUP:-true}
      DITRA_DEVTEST_GATEWAY_ALLOW_DIRECT_CALLS: ${DITRA_DEVTEST_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      DITRA_DEVTEST_GATEWAY_DIRECT_RESULT_STRATEGY: ${DITRA_DEVTEST_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}

      # Downstream integration toggles
      DITRA_DEVTEST_GATEWAY_ENABLE_ANTICAFARMACIA: ${DITRA_DEVTEST_GATEWAY_ENABLE_ANTICAFARMACIA:-true}
      DITRA_DEVTEST_GATEWAY_ANTICAFARMACIA_URL: ${DITRA_DEVTEST_GATEWAY_ANTICAFARMACIA_URL:-http://anticafarmacia-mcp:8002/mcp}
      DITRA_DEVTEST_GATEWAY_ANTICAFARMACIA_AUTH: ${DITRA_DEVTEST_GATEWAY_ANTICAFARMACIA_AUTH:-}

      # FerreroMed toolbox remotes (working examples)
      DITRA_DEVTEST_GATEWAY_ENABLE_TOOLBOX: ${DITRA_DEVTEST_GATEWAY_ENABLE_TOOLBOX:-true}
      DITRA_DEVTEST_GATEWAY_TOOLBOX_HOST: ${DITRA_DEVTEST_GATEWAY_TOOLBOX_HOST:-toolbox}
      DITRA_DEVTEST_GATEWAY_TOOLBOX_PORT: ${DITRA_DEVTEST_GATEWAY_TOOLBOX_PORT:-5000}
      DITRA_DEVTEST_GATEWAY_TOOLBOX_INIT_TIMEOUT_MS: ${DITRA_DEVTEST_GATEWAY_TOOLBOX_INIT_TIMEOUT_MS:-20000}
      DITRA_DEVTEST_GATEWAY_TOOLBOX_TIMEOUT_MS: ${DITRA_DEVTEST_GATEWAY_TOOLBOX_TIMEOUT_MS:-60000}
      DITRA_DEVTEST_GATEWAY_TOOLBOX_SERVER_INSTRUCTIONS: ${DITRA_DEVTEST_GATEWAY_TOOLBOX_SERVER_INSTRUCTIONS:-true}

      # Remote MCP backend configuration
      DITRA_DEVTEST_GATEWAY_REMOTES_JSON: ${DITRA_DEVTEST_GATEWAY_REMOTES_JSON:-}
      DITRA_DEVTEST_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${DITRA_DEVTEST_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}

      # FastMCP settings
      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8001}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}
      FASTMCP_STATELESS_HTTP: ${FASTMCP_STATELESS_HTTP:-true}

      # Optional MCP auth mode
      DITRA_DEVTEST_MCP_AUTH_MODE: ${DITRA_DEVTEST_MCP_AUTH_MODE:-none}
      DITRA_DEVTEST_MCP_BASE_URL: ${DITRA_DEVTEST_MCP_BASE_URL:-}
      DITRA_DEVTEST_MCP_RESOURCE_BASE_URL: ${DITRA_DEVTEST_MCP_RESOURCE_BASE_URL:-}
      DITRA_DEVTEST_MCP_AUTH_DEBUG: ${DITRA_DEVTEST_MCP_AUTH_DEBUG:-false}
      DITRA_DEVTEST_OIDC_CONFIG_URL: ${DITRA_DEVTEST_OIDC_CONFIG_URL:-}
      DITRA_DEVTEST_OIDC_CLIENT_ID: ${DITRA_DEVTEST_OIDC_CLIENT_ID:-}
      DITRA_DEVTEST_OIDC_CLIENT_SECRET: ${DITRA_DEVTEST_OIDC_CLIENT_SECRET:-}
      DITRA_DEVTEST_OIDC_JWT_SIGNING_KEY: ${DITRA_DEVTEST_OIDC_JWT_SIGNING_KEY:-}
      DITRA_DEVTEST_OIDC_REQUIRED_SCOPES: ${DITRA_DEVTEST_OIDC_REQUIRED_SCOPES:-openid profile email}
      DITRA_DEVTEST_OIDC_ALLOWED_CLIENT_REDIRECT_URIS: ${DITRA_DEVTEST_OIDC_ALLOWED_CLIENT_REDIRECT_URIS:-}
      DITRA_DEVTEST_OIDC_VERIFY_ID_TOKEN: ${DITRA_DEVTEST_OIDC_VERIFY_ID_TOKEN:-false}
      DITRA_DEVTEST_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${DITRA_DEVTEST_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}

    ports:
      - "${DITRA_DEVTEST_MCP_HOST_PORT:-8098}:${FASTMCP_PORT:-8001}"
    restart: unless-stopped
