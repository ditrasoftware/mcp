version: "3.8"

services:
  ditrasoftware-mcp:
    build: .
    container_name: ditrasoftware-mcp
    environment:
      # Configure base API settings
      DITRASOFTWARE_API_BASE_URL: ${DITRASOFTWARE_API_BASE_URL:-}
      DITRASOFTWARE_API_TIMEOUT_SECONDS: ${DITRASOFTWARE_API_TIMEOUT_SECONDS:-30}
      DITRASOFTWARE_VERIFY_SSL: ${DITRASOFTWARE_VERIFY_SSL:-true}
      DITRASOFTWARE_DEFAULT_API_KEY: ${DITRASOFTWARE_DEFAULT_API_KEY:-}

      # Configure gateway behavior
      DITRASOFTWARE_GATEWAY_MODE: ${DITRASOFTWARE_GATEWAY_MODE:-hybrid}
      DITRASOFTWARE_GATEWAY_ROUTE_POLICY: ${DITRASOFTWARE_GATEWAY_ROUTE_POLICY:-local_preferred}
      DITRASOFTWARE_GATEWAY_MOUNT_ON_STARTUP: ${DITRASOFTWARE_GATEWAY_MOUNT_ON_STARTUP:-true}
      DITRASOFTWARE_GATEWAY_ALLOW_DIRECT_CALLS: ${DITRASOFTWARE_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      DITRASOFTWARE_GATEWAY_DIRECT_RESULT_STRATEGY: ${DITRASOFTWARE_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}

      # Remote MCP backend configuration
      DITRASOFTWARE_GATEWAY_REMOTES_JSON: ${DITRASOFTWARE_GATEWAY_REMOTES_JSON:-}
      DITRASOFTWARE_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${DITRASOFTWARE_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}

      # FastMCP settings
      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8001}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}

    ports:
      - "${FASTMCP_PORT:-8001}:8001"
    restart: unless-stopped
