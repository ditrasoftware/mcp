services:
  lottomaticapss_mcp:
    image: ${LOTTOMATICAPSS_MCP_IMAGE:-gcr.io/oxytrack-322814/ditra-lottomaticapss-mcp:1.1.47}
    container_name: lottomaticapss-mcp
    environment:
      LOTTOMATICAPSS_API_BASE_URL: ${LOTTOMATICAPSS_API_BASE_URL:-}
      LOTTOMATICAPSS_API_TIMEOUT_SECONDS: ${LOTTOMATICAPSS_API_TIMEOUT_SECONDS:-30}
      LOTTOMATICAPSS_VERIFY_SSL: ${LOTTOMATICAPSS_VERIFY_SSL:-true}
      LOTTOMATICAPSS_DEFAULT_API_KEY: ${LOTTOMATICAPSS_DEFAULT_API_KEY:-}

      METABASE_SITE_URL: ${METABASE_SITE_URL:-https://analytics.ditra.io}
      METABASE_MCP_URL: ${METABASE_MCP_URL:-https://analytics.ditra.io/api/metabase-mcp}
      METABASE_ACCESS_MODE: ${METABASE_ACCESS_MODE:-mcp_first}
      METABASE_API_FALLBACK_ENABLED: ${METABASE_API_FALLBACK_ENABLED:-true}
      METABASE_API_KEY: ${METABASE_API_KEY:-}
      METABASE_USERNAME: ${METABASE_USERNAME:-}
      METABASE_PASSWORD: ${METABASE_PASSWORD:-}
      METABASE_TIMEOUT_SECONDS: ${METABASE_TIMEOUT_SECONDS:-30}
      METABASE_VERIFY_SSL: ${METABASE_VERIFY_SSL:-true}
      METABASE_DEFAULT_PAGE_SIZE: ${METABASE_DEFAULT_PAGE_SIZE:-100}
      METABASE_MAX_PAGE_SIZE: ${METABASE_MAX_PAGE_SIZE:-500}
      METABASE_DEFAULT_DASHBOARD_ID: ${METABASE_DEFAULT_DASHBOARD_ID:-30}
      METABASE_DEFAULT_COLLECTION_ID: ${METABASE_DEFAULT_COLLECTION_ID:-6}
      LOTTOMATICAPSS_KPI_SOURCE_CARD_ID: ${LOTTOMATICAPSS_KPI_SOURCE_CARD_ID:-685}
      LOTTOMATICAPSS_KPI_DATE_FIELD: ${LOTTOMATICAPSS_KPI_DATE_FIELD:-}
      METABASE_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET_KEY:-}
      METABASE_EMBED_TOKEN_TTL_SECONDS: ${METABASE_EMBED_TOKEN_TTL_SECONDS:-600}
      LOTTOMATICAPSS_NATIVE_SAVED_VIEWER_ENABLED: ${LOTTOMATICAPSS_NATIVE_SAVED_VIEWER_ENABLED:-false}

      LOTTOMATICAPSS_GATEWAY_MODE: ${LOTTOMATICAPSS_GATEWAY_MODE:-hybrid}
      LOTTOMATICAPSS_GATEWAY_ROUTE_POLICY: ${LOTTOMATICAPSS_GATEWAY_ROUTE_POLICY:-local_preferred}
      LOTTOMATICAPSS_GATEWAY_MOUNT_ON_STARTUP: ${LOTTOMATICAPSS_GATEWAY_MOUNT_ON_STARTUP:-false}
      LOTTOMATICAPSS_GATEWAY_ALLOW_DIRECT_CALLS: ${LOTTOMATICAPSS_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      LOTTOMATICAPSS_GATEWAY_DIRECT_RESULT_STRATEGY: ${LOTTOMATICAPSS_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}
      LOTTOMATICAPSS_GATEWAY_ADVERTISE_MCP_APPS_UI: ${LOTTOMATICAPSS_GATEWAY_ADVERTISE_MCP_APPS_UI:-true}
      LOTTOMATICAPSS_GATEWAY_ENABLE_TOOLBOX: ${LOTTOMATICAPSS_GATEWAY_ENABLE_TOOLBOX:-false}
      LOTTOMATICAPSS_GATEWAY_REMOTES_JSON: ${LOTTOMATICAPSS_GATEWAY_REMOTES_JSON:-}
      LOTTOMATICAPSS_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${LOTTOMATICAPSS_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}
      LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_URL: ${LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_URL:-}
      LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_ENABLED: ${LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_ENABLED:-true}
      LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_INIT_TIMEOUT_MS: ${LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_INIT_TIMEOUT_MS:-20000}
      LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_TIMEOUT_MS: ${LOTTOMATICAPSS_DITRA_ANALYTICS_MCP_TIMEOUT_MS:-60000}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_ACCESS_TOKEN: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_ACCESS_TOKEN:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_TOKEN_ENDPOINT: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_TOKEN_ENDPOINT:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_REFRESH_TOKEN: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_REFRESH_TOKEN:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_CLIENT_ID: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_CLIENT_ID:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_CLIENT_SECRET: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_CLIENT_SECRET:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_SCOPE: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_SCOPE:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_TOKEN_ENDPOINT_AUTH_METHOD: ${LOTTOMATICAPSS_GATEWAY_REMOTE_DITRA_ANALYTICS_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_basic}
      LOTTOMATICAPSS_GATEWAY_REMOTE_AUTH_STORE_PATH: ${LOTTOMATICAPSS_GATEWAY_REMOTE_AUTH_STORE_PATH:-/root/.local/share/fastmcp/remote-auth.json}
      LOTTOMATICAPSS_GATEWAY_CONNECTIONS_JSON: ${LOTTOMATICAPSS_GATEWAY_CONNECTIONS_JSON:-}
      LOTTOMATICAPSS_GATEWAY_REMOTE_AUTH_ENCRYPTION_KEY: ${LOTTOMATICAPSS_GATEWAY_REMOTE_AUTH_ENCRYPTION_KEY:-}
      LOTTOMATICAPSS_GATEWAY_DITRA_SELF_SERVICE: ${LOTTOMATICAPSS_GATEWAY_DITRA_SELF_SERVICE:-false}
      LOTTOMATICAPSS_DOWNSTREAM_ADMIN_TOKEN: ${LOTTOMATICAPSS_DOWNSTREAM_ADMIN_TOKEN:-}
      LOTTOMATICAPSS_DITRA_ANALYTICS_OAUTH_SCOPES: ${LOTTOMATICAPSS_DITRA_ANALYTICS_OAUTH_SCOPES:-}

      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8001}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}
      FASTMCP_STATELESS_HTTP: ${FASTMCP_STATELESS_HTTP:-true}
      LOTTOMATICAPSS_MCP_AUTH_MODE: ${LOTTOMATICAPSS_MCP_AUTH_MODE:-none}
      LOTTOMATICAPSS_MCP_BASE_URL: ${LOTTOMATICAPSS_MCP_BASE_URL:-https://mcp.lottomatica-pss.ditra.app}
      LOTTOMATICAPSS_MCP_RESOURCE_BASE_URL: ${LOTTOMATICAPSS_MCP_RESOURCE_BASE_URL:-}
      LOTTOMATICAPSS_GCIP_PROJECT_ID: ${LOTTOMATICAPSS_GCIP_PROJECT_ID:-}
      LOTTOMATICAPSS_GCIP_TENANT_ID: ${LOTTOMATICAPSS_GCIP_TENANT_ID:-}
      LOTTOMATICAPSS_GCIP_WEB_API_KEY: ${LOTTOMATICAPSS_GCIP_WEB_API_KEY:-}
      LOTTOMATICAPSS_GCIP_AUTH_DOMAIN: ${LOTTOMATICAPSS_GCIP_AUTH_DOMAIN:-}
      LOTTOMATICAPSS_GCIP_CLIENT_ID: ${LOTTOMATICAPSS_GCIP_CLIENT_ID:-}
      LOTTOMATICAPSS_GCIP_SIGNING_KEY: ${LOTTOMATICAPSS_GCIP_SIGNING_KEY:-}
      LOTTOMATICAPSS_GCIP_ACCESS_MODE: ${LOTTOMATICAPSS_GCIP_ACCESS_MODE:-subjects}
      LOTTOMATICAPSS_GCIP_ALLOWED_SUBJECTS: ${LOTTOMATICAPSS_GCIP_ALLOWED_SUBJECTS:-}
      LOTTOMATICAPSS_GCIP_ACCESS_CLAIM: ${LOTTOMATICAPSS_GCIP_ACCESS_CLAIM:-}
      LOTTOMATICAPSS_GCIP_CLIENT_REDIRECT_URIS: ${LOTTOMATICAPSS_GCIP_CLIENT_REDIRECT_URIS:-}
    ports:
      - "${LOTTOMATICAPSS_MCP_HOST_PORT:-8097}:${FASTMCP_PORT:-8001}"
    volumes:
      - lottomaticapss_fastmcp_home:/root/.local/share/fastmcp
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - ditra-shared

networks:
  ditra-shared:
    external: true
    name: ${LOTTOMATICAPSS_SHARED_NETWORK:-ditra-shared}

volumes:
  lottomaticapss_fastmcp_home: