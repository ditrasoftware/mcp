version: "3.8"

# Purpose: MCP-focused local/dev compose for Lottomaticapss.
# This is the canonical compose file in this server folder.

services:
  lottomaticapss-mcp:
    build: .
    container_name: lottomaticapss-mcp
    environment:
      # Configure base API settings
      LOTTOMATICAPSS_API_BASE_URL: ${LOTTOMATICAPSS_API_BASE_URL:-}
      LOTTOMATICAPSS_API_TIMEOUT_SECONDS: ${LOTTOMATICAPSS_API_TIMEOUT_SECONDS:-30}
      LOTTOMATICAPSS_VERIFY_SSL: ${LOTTOMATICAPSS_VERIFY_SSL:-true}
      LOTTOMATICAPSS_DEFAULT_API_KEY: ${LOTTOMATICAPSS_DEFAULT_API_KEY:-}

      # Configure gateway behavior
      LOTTOMATICAPSS_GATEWAY_MODE: ${LOTTOMATICAPSS_GATEWAY_MODE:-hybrid}
      LOTTOMATICAPSS_GATEWAY_ROUTE_POLICY: ${LOTTOMATICAPSS_GATEWAY_ROUTE_POLICY:-local_preferred}
      LOTTOMATICAPSS_GATEWAY_MOUNT_ON_STARTUP: ${LOTTOMATICAPSS_GATEWAY_MOUNT_ON_STARTUP:-true}
      LOTTOMATICAPSS_GATEWAY_ALLOW_DIRECT_CALLS: ${LOTTOMATICAPSS_GATEWAY_ALLOW_DIRECT_CALLS:-true}
      LOTTOMATICAPSS_GATEWAY_DIRECT_RESULT_STRATEGY: ${LOTTOMATICAPSS_GATEWAY_DIRECT_RESULT_STRATEGY:-passthrough}

      # Remote MCP backend configuration
      LOTTOMATICAPSS_GATEWAY_REMOTES_JSON: ${LOTTOMATICAPSS_GATEWAY_REMOTES_JSON:-}
      LOTTOMATICAPSS_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON: ${LOTTOMATICAPSS_GATEWAY_TOOL_ROUTE_OVERRIDES_JSON:-}

      # FastMCP settings
      FASTMCP_HOST: ${FASTMCP_HOST:-0.0.0.0}
      FASTMCP_PORT: ${FASTMCP_PORT:-8001}
      FASTMCP_STREAMABLE_HTTP_PATH: ${FASTMCP_STREAMABLE_HTTP_PATH:-/mcp}
      FASTMCP_STATELESS_HTTP: ${FASTMCP_STATELESS_HTTP:-true}

      # Optional MCP auth mode
      LOTTOMATICAPSS_MCP_AUTH_MODE: ${LOTTOMATICAPSS_MCP_AUTH_MODE:-none}
      LOTTOMATICAPSS_MCP_BASE_URL: ${LOTTOMATICAPSS_MCP_BASE_URL:-}
      LOTTOMATICAPSS_MCP_RESOURCE_BASE_URL: ${LOTTOMATICAPSS_MCP_RESOURCE_BASE_URL:-}
      LOTTOMATICAPSS_MCP_AUTH_DEBUG: ${LOTTOMATICAPSS_MCP_AUTH_DEBUG:-false}
      LOTTOMATICAPSS_OIDC_CONFIG_URL: ${LOTTOMATICAPSS_OIDC_CONFIG_URL:-}
      LOTTOMATICAPSS_OIDC_CLIENT_ID: ${LOTTOMATICAPSS_OIDC_CLIENT_ID:-}
      LOTTOMATICAPSS_OIDC_CLIENT_SECRET: ${LOTTOMATICAPSS_OIDC_CLIENT_SECRET:-}
      LOTTOMATICAPSS_OIDC_JWT_SIGNING_KEY: ${LOTTOMATICAPSS_OIDC_JWT_SIGNING_KEY:-}
      LOTTOMATICAPSS_OIDC_REQUIRED_SCOPES: ${LOTTOMATICAPSS_OIDC_REQUIRED_SCOPES:-openid profile email}
      LOTTOMATICAPSS_OIDC_ALLOWED_CLIENT_REDIRECT_URIS: ${LOTTOMATICAPSS_OIDC_ALLOWED_CLIENT_REDIRECT_URIS:-}
      LOTTOMATICAPSS_OIDC_VERIFY_ID_TOKEN: ${LOTTOMATICAPSS_OIDC_VERIFY_ID_TOKEN:-false}
      LOTTOMATICAPSS_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${LOTTOMATICAPSS_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_post}

    ports:
      - "${FASTMCP_PORT:-8001}:8001"
    restart: unless-stopped
